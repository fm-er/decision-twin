function node(tag,content){let el=document.createElement(tag);el.textContent=content;return el}
function section(root,title,contents){root.appendChild(node("h3",title));if(Array.isArray(contents)){let ul=node("ul","");contents.forEach(s=>ul.appendChild(node("li",s)));root.appendChild(ul)}else root.appendChild(node("p",contents))}
